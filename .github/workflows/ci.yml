name: Validation

# Validates changes to this repository: checks formatting with Prettier,
# validates the marketplace manifest and every plugin manifest, checks the
# project configuration examples against their schema, and tests the hooks
# and the skills' scripts - so a broken plugin definition, file format,
# guardrail or checker fails here before merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege token: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false # the GITHUB_TOKEN is not needed after the checkout - don't leave it in .git/config

      # NODE_VERSION_OVERRIDE is a repository variable; unset it to fall back
      # to engines.node from package.json, populate it to pin a version
      # without touching this workflow file.
      - name: Select Node Version
        uses: svierk/get-node-version@v1.6.0
        with:
          node-version: ${{ vars.NODE_VERSION_OVERRIDE }}

      - name: Install Dependencies
        run: npm ci

      - name: Check Formatting
        run: npm run prettier:verify

      # The CLI comes from the dev dependencies; npm puts its bin on the PATH.
      - name: Validate Manifests and Schemas
        run: npm run validate

      # The hooks must run on the bash 3.2 that ships with macOS as well; the
      # tests cover the Ubuntu runner's bash, and BASH_BIN=/bin/bash locally.
      - name: Run Tests
        run: npm test
