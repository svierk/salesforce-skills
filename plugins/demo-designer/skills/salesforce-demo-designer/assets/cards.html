<!doctype html>
<!--
  Intro, chapter and outro cards for the Demo Kit. captureCard() opens this
  file with ?scene=intro|chapter|outro, calls fill(data) and then play().
  Sizes are in vmin, so one file serves 16:9, 1:1, 4:5 and 9:16 stages.
  Restyle freely - keep fill(), play() and the paused-until-play rule.

  data: {
    brand:   { bg, surface, text, muted, accent: [from, via, to] },
    eyebrow, title, subtitle, meta, cta,     (strings; title may use <em> for the accent gradient)
    logo, image,                             (paths relative to this file, or URLs)
    chips:   ["...", ...],
    stats:   [{ value, label }, ...]
  }
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b1120;
        --surface: rgba(19, 29, 51, 0.85);
        --text: #f3f4f6;
        --muted: #98a2b3;
        --a1: #5b21d6;
        --a2: #1d4ed8;
        --a3: #00b8f0;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, 'Segoe UI', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* Every animation waits at its first frame until the recorder calls play(). */
      body:not(.go) * {
        animation-play-state: paused !important;
      }
      .glow {
        position: absolute;
        inset: -10%;
        pointer-events: none;
        background:
          radial-gradient(35vmax 25vmax at 30% 40%, color-mix(in srgb, var(--a1) 38%, transparent), transparent 70%),
          radial-gradient(38vmax 26vmax at 70% 55%, color-mix(in srgb, var(--a2) 42%, transparent), transparent 70%),
          radial-gradient(28vmax 20vmax at 55% 30%, color-mix(in srgb, var(--a3) 22%, transparent), transparent 70%);
        filter: blur(3vmin);
        animation: drift 4s ease-in-out both;
      }
      @keyframes drift {
        from {
          transform: scale(1.08);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      .up {
        animation: up 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      @keyframes up {
        from {
          opacity: 0;
          transform: translateY(2.5vmin);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .pop {
        animation: pop 0.8s cubic-bezier(0.2, 1.3, 0.3, 1) both;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.6) rotate(-8deg);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      em,
      .grad {
        font-style: normal;
        background: linear-gradient(120deg, var(--a1), var(--a2) 45%, var(--a3));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      [hidden] {
        display: none !important;
      }
      .scene {
        position: absolute;
        inset: 0;
        display: none;
        padding: 6vmin;
      }
      .scene.on {
        display: flex;
      }
      .eyebrow {
        font-size: 2.3vmin;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--a3);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1.6vmin;
      }
      .chip {
        font-size: 2.8vmin;
        font-weight: 600;
        padding: 1.5vmin 2.8vmin;
        border-radius: 999px;
        background: var(--surface);
        border: 1px solid color-mix(in srgb, var(--a2) 45%, transparent);
      }
      .chip::before {
        content: '✦';
        color: var(--a3);
        margin-right: 1vmin;
      }
      .meta {
        font-size: 2.1vmin;
        color: var(--muted);
        font-weight: 500;
      }

      /* Intro and chapter: centred */
      #intro,
      #chapter {
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 2.8vmin;
      }
      #intro .logo {
        height: 16vmin;
        max-width: 50vw;
        object-fit: contain;
        filter: drop-shadow(0 2vmin 4vmin color-mix(in srgb, var(--a2) 55%, transparent));
      }
      #intro h1 {
        font-size: 9vmin;
        font-weight: 800;
        letter-spacing: -0.025em;
        line-height: 1.05;
      }
      #intro .subtitle,
      #chapter .subtitle {
        font-size: 3.2vmin;
        color: var(--muted);
        font-weight: 500;
        max-width: 80vw;
      }
      #chapter h2 {
        font-size: 7vmin;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      /* Outro: picture beside the text on wide stages, above it on tall ones */
      #outro {
        align-items: center;
        justify-content: center;
        gap: 6vmin;
      }
      #outro .image {
        width: 38vw;
        max-height: 70vh;
        object-fit: cover;
        border-radius: 2.4vmin;
        box-shadow:
          0 3vmin 9vmin color-mix(in srgb, var(--a2) 45%, transparent),
          0 0 0 1px color-mix(in srgb, var(--a2) 30%, transparent);
      }
      #outro .text {
        display: flex;
        flex-direction: column;
        gap: 2.6vmin;
        max-width: 50vw;
      }
      #outro h2 {
        font-size: 6.2vmin;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.08;
      }
      .stats {
        display: flex;
        gap: 4vmin;
      }
      .stat {
        display: flex;
        flex-direction: column;
      }
      .stat strong {
        font-size: 5.6vmin;
        font-weight: 800;
        line-height: 1.1;
      }
      .stat span {
        font-size: 2.1vmin;
        color: var(--muted);
        font-weight: 500;
      }
      .cta {
        align-self: flex-start;
        font-size: 2.8vmin;
        font-weight: 600;
        color: #fff;
        padding: 1.7vmin 3vmin;
        border-radius: 1.4vmin;
        background: var(--a2);
        box-shadow: 0 1vmin 3vmin color-mix(in srgb, var(--a2) 50%, transparent);
      }
      /* Without a picture the text stands alone in the middle. */
      #outro:has(.image[hidden]) .text {
        align-items: center;
        text-align: center;
        max-width: 80vw;
      }
      #outro:has(.image[hidden]) .cta {
        align-self: center;
      }
      #outro:has(.image[hidden]) .stats {
        justify-content: center;
      }
      @media (max-aspect-ratio: 1/1) {
        #outro {
          flex-direction: column;
          text-align: center;
        }
        #outro .image {
          width: 70vw;
          max-height: 42vh;
        }
        #outro .text {
          max-width: 86vw;
          align-items: center;
        }
        .cta {
          align-self: center;
        }
        .stats {
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>

    <section id="intro" class="scene">
      <img class="logo pop" data-slot="logo" alt="" />
      <div class="eyebrow up" style="animation-delay: 0.25s" data-slot="eyebrow"></div>
      <h1 class="up" style="animation-delay: 0.4s" data-slot="title"></h1>
      <div class="subtitle up" style="animation-delay: 0.6s" data-slot="subtitle"></div>
      <div class="chips" data-slot="chips"></div>
    </section>

    <section id="chapter" class="scene">
      <div class="eyebrow up" data-slot="eyebrow"></div>
      <h2 class="up" style="animation-delay: 0.15s" data-slot="title"></h2>
      <div class="subtitle up" style="animation-delay: 0.3s" data-slot="subtitle"></div>
    </section>

    <section id="outro" class="scene">
      <img class="image pop" data-slot="image" alt="" />
      <div class="text">
        <div class="eyebrow up" style="animation-delay: 0.2s" data-slot="eyebrow"></div>
        <h2 class="up" style="animation-delay: 0.35s" data-slot="title"></h2>
        <div class="stats up" style="animation-delay: 0.6s" data-slot="stats"></div>
        <div class="cta up" style="animation-delay: 0.85s" data-slot="cta"></div>
        <div class="meta up" style="animation-delay: 1s" data-slot="meta"></div>
      </div>
    </section>

    <script>
      const scene = document.getElementById(new URLSearchParams(location.search).get('scene') || 'intro');
      scene.classList.add('on');

      window.fill = (data = {}) => {
        const brand = data.brand || {};
        const root = document.documentElement.style;
        if (brand.bg) root.setProperty('--bg', brand.bg);
        if (brand.surface) root.setProperty('--surface', brand.surface);
        if (brand.text) root.setProperty('--text', brand.text);
        if (brand.muted) root.setProperty('--muted', brand.muted);
        (brand.accent || []).forEach((c, i) => root.setProperty(`--a${i + 1}`, c));

        for (const el of scene.querySelectorAll('[data-slot]')) {
          const value = data[el.dataset.slot];
          el.hidden = value === undefined || value === null || (Array.isArray(value) && !value.length);
          if (el.hidden) continue;
          if (el.tagName === 'IMG') el.src = value;
          else if (el.dataset.slot === 'chips') {
            el.replaceChildren(
              ...value.map((text, i) => {
                const chip = document.createElement('span');
                chip.className = 'chip up';
                chip.style.animationDelay = `${0.9 + i * 0.2}s`;
                chip.innerHTML = text;
                return chip;
              })
            );
          } else if (el.dataset.slot === 'stats') {
            el.replaceChildren(
              ...value.map(({ value, label }) => {
                const stat = document.createElement('div');
                stat.className = 'stat';
                stat.innerHTML = `<strong class="grad">${value}</strong><span>${label}</span>`;
                return stat;
              })
            );
          } else el.innerHTML = value;
        }
      };

      window.play = () => document.body.classList.add('go');
    </script>
  </body>
</html>
